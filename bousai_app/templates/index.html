{% extends "base.html" %}

{% block content %}
<div class="content-card">
  <div class="section-title" style="display: flex; align-items: center; gap: 10px; font-weight: 700; font-size: 1.05rem; color: #124a87; margin: 2px 0 14px;">
    <svg width="22" height="22" viewBox="0 0 24 24" aria-hidden="true" style="display:block; color:#1a73c7; fill:currentColor;">
      <path d="M12 2C8.13 2 5 5.13 5 9c0 5.25 7 13 7 13s7-7.75 7-13c0-3.87-3.13-7-7-7zm0 9.5A2.5 2.5 0 1 1 12 6a2.5 2.5 0 0 1 0 5.5z"/>
    </svg>
    <span>避難所マップ</span>
  </div>
  <div id="shelterMap" style="height: 430px; width: 100%; border-radius: 14px; overflow: hidden; border: 1px solid #dfe4e8;"></div>
</div>

<div class="content-card" style="padding-top: 18px; padding-bottom: 16px;">
  <div style="display: flex; align-items: center; justify-content: space-between; gap: 16px; border-bottom: 1px solid #d8dee5; padding-bottom: 12px; margin-bottom: 14px;">
    <div style="display: flex; align-items: center; gap: 10px; color: #0d4d8a; font-weight: 700; font-size: 1.05rem;">
      <svg width="24" height="24" viewBox="0 0 24 24" aria-hidden="true" style="display:block; color:#1a73c7; fill:currentColor;">
        <path d="M18.5 17.5H6.5A4.5 4.5 0 0 1 6 8.5a5.5 5.5 0 0 1 10.7-1.8A3.8 3.8 0 0 1 18.5 17.5zm-12.1-2h13.2a2.7 2.7 0 0 0 0-5.4h-.4a4.9 4.9 0 0 0-9.5-1.2A3.7 3.7 0 0 0 6.4 15.5z"/>
      </svg>
      <span>青森市 気象警報・注意報</span>
    </div>
    <div style="display: inline-flex; align-items: center; gap: 8px; color: #1f9b60; font-weight: 700; font-size: 0.92rem; background: rgba(31, 155, 96, 0.08); border: 1px solid rgba(31, 155, 96, 0.18); padding: 8px 12px; border-radius: 999px;">
      <span style="font-size: 1rem;">↻</span>
      <span>10分おき自動更新</span>
    </div>
  </div>

  <div id="weatherContent" style="color: #2a3b4d; line-height: 1.8;">
    <p style="margin: 0;">読み込み中...</p>
  </div>
</div>

<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<script>
document.addEventListener('DOMContentLoaded', function() {
    const map = L.map('shelterMap').setView([35.3390, 139.4903], 12);

    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
        attribution: '© OpenStreetMap contributors',
        referrerPolicy: 'strict-origin-when-cross-origin'
    }).addTo(map);

    function updateWeatherWarnings() {
        fetch('/api/weather_warnings')
            .then(response => response.json())
            .then(data => updateWeatherContent(data))
            .catch(() => {
                document.getElementById('weatherContent').innerHTML = '<p>気象情報の取得に失敗しました。</p>';
            });
    }

    function updateWeatherContent(data) {
        const weatherContent = document.getElementById('weatherContent');

        if (data.error) {
            weatherContent.innerHTML = '<p>気象情報の取得に失敗しました。</p>';
            return;
        }

        let warningsHtml = '<p>現在、警報・注意報は発表されていません。</p>';
        if (data.warnings && data.warnings.length > 0) {
            warningsHtml = '<ul style="margin: 8px 0 0 18px; padding: 0;">' + data.warnings.map(w =>
                `<li>${w.name}（${w.status}）</li>`
            ).join('') + '</ul>';
        }

        weatherContent.innerHTML = `
            <div style="display: flex; align-items: center; gap: 8px; color: #1b2f46; margin-bottom: 4px; font-weight: 700;">
              <span style="font-size:1.2rem;">●</span>
              <span>${data.area_name || '青森市'}</span>
            </div>
            <div style="margin: 8px 0 10px; color: #2e9d68; font-weight: 700;">
              ${warningsHtml}
            </div>
            <div style="color: #5f6d7d; font-size: 0.96rem; display: flex; align-items: center; gap: 8px;">
              <svg width="16" height="16" viewBox="0 0 24 24" aria-hidden="true" style="display:block; color:#1a73c7; fill:currentColor;">
                <path d="M12 2a10 10 0 1 0 10 10A10 10 0 0 0 12 2zm1 11h4v2h-6V7h2z"/>
              </svg>
              <span>データ取得時刻: ${data.last_fetch_time || '更新中...'}</span>
            </div>
            <div style="color: #5f6d7d; font-size: 0.96rem;">気象庁最終発表: ${data.report_time || '不明'}</div>
        `;
    }

    updateWeatherWarnings();
    setInterval(updateWeatherWarnings, 600000);
});
</script>
{% endblock %}
